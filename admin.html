<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector 7 - Admin Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #fff; }
        .tech-font { font-family: 'Share Tech Mono', monospace; }
        .tactical-border { border: 1px solid #333; box-shadow: 0 0 20px rgba(234, 179, 8, 0.1); background: #0a0a0a; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md mt-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold uppercase tracking-widest text-white">Admin Command</h1>
                <p class="tech-font text-xs text-orange-500 mt-1">SECTOR 7 // CLASSIFIED</p>
            </div>
            <a href="index.html" class="tech-font text-xs bg-red-900/50 border border-red-700 text-red-400 px-3 py-1 rounded hover:bg-red-800 transition">EXIT</a>
        </div>

        <!-- Stats Panel -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="tactical-border p-4 rounded text-center">
                <p class="tech-font text-gray-400 text-xs mb-1 uppercase">Total Users</p>
                <p id="totalUsers" class="text-3xl font-bold text-white">0</p>
            </div>
            <div class="tactical-border p-4 rounded text-center">
                <p class="tech-font text-gray-400 text-xs mb-1 uppercase">Paid Recruits</p>
                <p id="paidUsers" class="text-3xl font-bold text-yellow-500">0</p>
            </div>
        </div>

        <button onclick="loadUsers()" class="w-full mb-4 tech-font text-xs bg-gray-800 border border-gray-600 text-gray-300 py-2 rounded hover:bg-gray-700 transition">
            🔄 REFRESH DATABASE
        </button>

        <!-- User List -->
        <div class="tactical-border rounded p-4">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2">Registered Agents</h2>
            <div id="userList" class="space-y-3 max-h-96 overflow-y-auto text-sm font-sans">
                <p class="tech-font text-gray-500 italic">Scanning database...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmu8zINhqaI7F-hH5gDeRC51oClBEnJ9A",
            authDomain: "sector-7-esports.firebaseapp.com",
            projectId: "sector-7-esports",
            storageBucket: "sector-7-esports.firebasestorage.app",
            messagingSenderId: "268248649597",
            appId: "1:268248649597:web:5d6dc3288bd474ef080614"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.loadUsers = async function() {
            const userListDiv = document.getElementById('userList');
            const totalUsersEl = document.getElementById('totalUsers');
            const paidUsersEl = document.getElementById('paidUsers');
            
            userListDiv.innerHTML = `<p class="tech-font text-orange-500 italic animate-pulse">Refreshing database...</p>`;

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                
                let count = 0;
                let paidCount = 0;
                let html = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const docId = doc.id;
                    count++;
                    if(data.paymentStatus === "Paid") paidCount++;

                    // Check if they have filled the tournament form yet
                    let ffDetails = `<p class="text-gray-500 text-xs italic mt-1">Has not filled Tournament Form yet.</p>`;
                    if (data.ffId) {
                        ffDetails = `
                            <div class="mt-1 bg-black/50 p-1 rounded border border-gray-800">
                                <p class="text-[10px] text-gray-400">IGN: <span class="text-white">${data.agentName}</span></p>
                                <p class="text-[10px] text-gray-400">UID: <span class="text-white">${data.ffId}</span></p>
                                <p class="text-[10px] text-gray-400">Mode: <span class="text-orange-400">${data.mode} (₦${data.amountPaid})</span></p>
                            </div>
                        `;
                    }

                    let actionBtn = "";
                    if (data.paymentStatus === "Paid") {
                        actionBtn = `<span class="tech-font text-[10px] px-2 py-1 rounded bg-green-900/50 text-green-400 border border-green-800">PAID ✅</span>`;
                    } else {
                        actionBtn = `<button onclick="markAsPaid('${docId}')" class="tech-font text-[10px] px-2 py-1 rounded bg-yellow-900/50 text-yellow-400 border border-yellow-800 hover:bg-yellow-600 hover:text-black transition">MARK PAID</button>`;
                    }

                    html += `
                        <div class="bg-black p-3 border border-gray-800 rounded mb-3">
                            <div class="flex justify-between items-start mb-1">
                                <p class="text-white font-bold text-xs truncate max-w-[150px]">${data.email}</p>
                                <div>${actionBtn}</div>
                            </div>
                            <p class="tech-font text-[9px] text-gray-600">${new Date(data.joinedAt).toLocaleDateString()}</p>
                            ${ffDetails}
                        </div>
                    `;
                });

                totalUsersEl.innerText = count;
                paidUsersEl.innerText = paidCount;
                
                if (count === 0) {
                    userListDiv.innerHTML = `<p class="tech-font text-gray-500 italic">No agents registered yet.</p>`;
                } else {
                    userListDiv.innerHTML = html;
                }

            } catch (error) {
                console.error("Error fetching users:", error);
                userListDiv.innerHTML = `<p class="text-red-500 tech-font text-xs">Error connecting to database.</p>`;
            }
        }

        window.markAsPaid = async function(userId) {
            if(confirm("Are you sure you want to mark this agent as PAID? Ensure you have checked Opay!")) {
                try {
                    const userRef = doc(db, "users", userId);
                    await updateDoc(userRef, { paymentStatus: "Paid" });
                    loadUsers();
                } catch (error) {
                    alert("Error updating user: " + error.message);
                }
            }
        }

        loadUsers();
    </script>
</body>
</html>
