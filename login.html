<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector 7 - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Rajdhani', sans-serif; background-color: #050505; color: #fff; }
        .hidden { display: none !important; }
        .premium-btn { background: linear-gradient(90deg, #ea580c 0%, #eab308 100%); color: #000; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-900 border border-gray-700 rounded p-8">
        <h1 class="text-2xl text-white font-bold mb-4 text-center">Sector 7 Login</h1>
        <input type="email" id="email" class="w-full p-2 mb-2 bg-black text-white border border-gray-600 rounded" placeholder="Email">
        <input type="password" id="password" class="w-full p-2 mb-4 bg-black text-white border border-gray-600 rounded" placeholder="Password">
        
        <button id="authBtn" onclick="handleAuth()" class="premium-btn w-full py-2 rounded">Register / Login</button>
        
        <p id="errorMsg" class="text-red-500 text-sm mt-4 hidden"></p>
        <p id="successMsg" class="text-green-500 text-sm mt-4 hidden"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmu8zINhqaI7F-hH5gDeRC51oClBEnJ9A",
            authDomain: "sector-7-esports.firebaseapp.com",
            projectId: "sector-7-esports",
            storageBucket: "sector-7-esports.firebasestorage.app",
            messagingSenderId: "268248649597",
            appId: "1:268248649597:web:5d6dc3288bd474ef080614"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const authBtn = document.getElementById('authBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        onAuthStateChanged(auth, (user) => {
            if (user) { 
                // Only redirect if we are on the login page
                if(window.location.pathname.includes("index") || window.location.pathname === "/") {
                    window.location.href = "tournament.html"; 
                }
            }
        });

        window.handleAuth = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            errorMsg.classList.add('hidden'); 
            successMsg.classList.add('hidden');

            if(!email || password.length < 6) {
                errorMsg.innerText = "Enter valid email and password (min 6 chars)."; 
                errorMsg.classList.remove('hidden');
                return;
            }

            authBtn.innerText = "PROCESSING..."; 
            authBtn.disabled = true;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // TRY TO SAVE TO FIRESTORE
                try {
                    await setDoc(doc(db, "users", user.uid), {
                        email: email,
                        joinedAt: new Date().toLocaleString('en-NG', { timeZone: 'Africa/Lagos' }),
                        paymentStatus: "Unpaid"
                    });
                    successMsg.innerText = "Saved to Database Successfully!"; 
                    successMsg.classList.remove('hidden');
                } catch (dbError) {
                    // THIS WILL POP UP AND TELL US EXACTLY WHY IT FAILED
                    alert("DATABASE ERROR: " + dbError.message);
                    errorMsg.innerText = "Failed to save to database.";
                    errorMsg.classList.remove('hidden');
                }

            } catch (error) {
                authBtn.innerText = "Register / Login"; 
                authBtn.disabled = false;
                errorMsg.innerText = error.message; 
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
